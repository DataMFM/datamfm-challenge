        type: radio
        options: ["End-to-End VLM", "Pipeline", "Hybrid", "Other"]
      - name: ExternalData
        description: "Does your method use external training data beyond the provided dataset?"
        type: boolean
        required: True
      - name: MethodDescription
        description: "Optional short description of your method"
        type: text
        required: False
      - name: ProjectURL
        description: "Optional project URL"
        type: text
        required: False
      - name: PublicationURL
