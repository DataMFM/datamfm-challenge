# DataMFM Challenge
# EvalAI Configuration
# Documentation: https://evalai.readthedocs.io/en/latest/configuration.html

title: "DataMFM Challenge: Document Parsing and Chart Understanding"
short_description: "CVPR 2026 DataMFM challenge with document parsing and chart understanding tracks."
description: templates/description.html
evaluation_details: templates/evaluation_details.html
terms_and_conditions: templates/terms_and_conditions.html
image: logo.jpg
submission_guidelines: templates/submission_guidelines.html
category: [Workshop, Computer Vision, Document Understanding]
leaderboard_description: "The challenge has two tracks. Document Parsing uses Text ED, Table TEDS, Formula CDM, Reading Order, and Overall. Chart Understanding uses CSV and summary metrics."
evaluation_script: evaluation_script.zip
remote_evaluation: True
start_date: 2026-03-24 00:00:00
end_date: 2026-06-30 23:59:59
published: True
tags:
  - document-parsing
  - chart-understanding
  - cvpr-2026
  - omnidocbench
  - chartnet

leaderboard:
  - id: 1
    schema:
      {
        "labels": ["Text_ED", "Table_TEDS", "Formula_CDM", "Reading_Order", "Overall"],
        "default_order_by": "Overall",
        "metadata": {
          "Text_ED": {"sort_ascending": True, "description": "Normalized edit distance for text. Lower is better."},
          "Table_TEDS": {"sort_ascending": False, "description": "Table TEDS score on a 0-100 scale."},
          "Formula_CDM": {"sort_ascending": False, "description": "Formula CDM score on a 0-100 scale."},
          "Reading_Order": {"sort_ascending": False, "description": "Reading-order score, computed as (1 - edit distance) * 100."},
          "Overall": {"sort_ascending": False, "description": "Mean of the four document parsing metrics after converting to 0-100 where needed."}
        }
      }
  - id: 2
    schema:
      {
        "labels": ["CSV_Numeric_F1", "CSV_Structural_Score", "Summary_ROUGE_L", "Summary_Numeric_Fact_F1", "Overall"],
        "default_order_by": "Overall",
        "metadata": {
          "CSV_Numeric_F1": {"sort_ascending": False, "description": "Numeric value F1 for chart-to-CSV on a 0-100 scale."},
          "CSV_Structural_Score": {"sort_ascending": False, "description": "CSV row/column/header structural score on a 0-100 scale."},
          "Summary_ROUGE_L": {"sort_ascending": False, "description": "ROUGE-L F1 for chart summaries on a 0-100 scale."},
          "Summary_Numeric_Fact_F1": {"sort_ascending": False, "description": "Numeric fact F1 for chart summaries on a 0-100 scale."},
          "Overall": {"sort_ascending": False, "description": "Mean of the four chart understanding metrics."}
        }
      }

